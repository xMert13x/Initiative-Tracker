<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll for Initiative</title>
  <link rel="preload" href="fonts/cinzel-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/alegreya.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/alegreya-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="Icon.png">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-text">Roll for Initiative</span>
    </div>
    <div class="round-display">
      <span class="round-label">Round</span>
      <span class="round-number" id="round-number">1</span>
    </div>
    <div class="controls">
      <button class="btn btn-icon" id="sound-btn" data-tip="Mute — M">&#128266;</button>
      <button class="btn btn-icon" id="fullscreen-btn" data-tip="Fullscreen — F">&#9974;</button>
      <button class="btn" id="settings-btn" data-tip="DM Remote">&#9881; DM Remote</button>
    </div>
  </header>

  <div class="position-display" id="position-display"></div>

  <main id="stage">
    <div id="carousel">
      <div class="center-frame" id="center-frame"></div>
    </div>
  </main>

  <!-- Overlay for drawers -->
  <div class="overlay" id="overlay"></div>

  <!-- Add Character Drawer -->
  <aside class="drawer" id="add-drawer">
    <div class="drawer-header">
      <h2>Add Character</h2>
      <button class="btn-close" data-close>&#10005;</button>
    </div>
    <div class="drawer-body">
      <div class="form-group">
        <label for="char-name">Character Name</label>
        <input type="text" id="char-name" placeholder="Enter character name" maxlength="30">
      </div>
      <div class="form-group">
        <label for="char-init">Initiative Roll</label>
        <input type="number" id="char-init" placeholder="e.g. 18" min="-5" max="99">
      </div>
      <div class="form-group">
        <label>Character Picture</label>
        <div class="image-upload-area" id="image-upload-area">
          <div class="upload-placeholder" id="upload-placeholder">
            <span class="upload-icon">&#128247;</span>
            <span>Click to upload image</span>
          </div>
          <img class="upload-preview" id="upload-preview" alt="Preview" style="display:none">
          <input type="file" id="char-image" accept="image/*" hidden>
        </div>
      </div>
      <div class="char-count" id="char-count"></div>
      <button class="btn btn-primary btn-full" id="add-confirm">Add Character</button>
      <button class="btn btn-full" id="add-done">Done</button>
    </div>
  </aside>

  <!-- Settings Drawer -->
  <aside class="drawer" id="settings-drawer">
    <div class="drawer-header">
      <h2>Settings</h2>
      <button class="btn-close" data-close>&#10005;</button>
    </div>
    <div class="drawer-body">
      <div class="settings-section">
        <h3>Background</h3>
        <div class="form-group">
          <label for="bg-color">Background Color</label>
          <div class="color-input-wrapper">
            <input type="color" id="bg-color" value="#000000">
            <span class="color-value" id="bg-color-value">#000000</span>
          </div>
        </div>
        <div class="form-group">
          <label>Background Image</label>
          <div class="image-upload-area small" id="bg-upload-area">
            <div class="upload-placeholder" id="bg-upload-placeholder">
              <span class="upload-icon">&#128444;</span>
              <span>Upload background image</span>
            </div>
            <img class="upload-preview" id="bg-upload-preview" alt="Preview" style="display:none">
            <input type="file" id="bg-image-input" accept="image/*" hidden>
          </div>
          <button class="btn btn-small" id="clear-bg-image" style="display:none">Remove Background Image</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>Characters (<span id="char-list-count">0</span>/20)</h3>
        <div class="char-list" id="char-list">
          <p class="empty-list-msg">No characters added yet.</p>
        </div>
        <button class="btn btn-danger btn-full" id="clear-all-chars">Clear All Characters</button>
      </div>

      <div class="settings-section">
        <h3>Combat</h3>
        <button class="btn btn-full" id="reset-round">Start New Combat</button>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="app.js?v=11"></script>
</body>
</html>
